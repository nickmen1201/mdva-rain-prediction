name: CI Secrets

on:
  push:
    branches: [ main, development, 'feature/**' ]
  pull_request:
    branches: [ main, development ]

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks (historial completo)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (historial completo)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan
        run: >
          docker run --rm -v "$GITHUB_WORKSPACE:/repo"
          ghcr.io/gitleaks/gitleaks:v8.30.1
          git /repo --no-banner --redact --verbose
