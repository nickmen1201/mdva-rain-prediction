# =============================================================================
# MDVA Backend - Development Profile Configuration
# =============================================================================
# Configuration overrides for local development environment.
# Activate with: --spring.profiles.active=dev
# =============================================================================

spring:
  config:
    # .env de la raíz del repo (gitignored) al correr con bootRun desde Backend/
    import: optional:file:../.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:5432/mdva
    username: postgres
    password: ${POSTGRES_PASSWORD}

# Enhanced logging for development
logging:
  level:
    ti.mdva: DEBUG
    org.jooq: DEBUG
    org.springframework.web: DEBUG


# Google Maps API key for development 
google:
  maps:
    api-key: ${GOOGLE_MAPS_API_KEY}

mdva:
  jwt:
    secret: ${JWT_SECRET}