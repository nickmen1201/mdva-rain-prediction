spring:
  application:
    name: mdva-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/mdva}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  jooq:
    sql-dialect: postgres

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

server:
  port: 8080
  servlet:
    context-path: /

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

google:
  maps:
    api-key: ${GOOGLE_MAPS_API_KEY:REEMPLAZAR}

ml:
  service:
    url: ${ML_SERVICE_URL:http://localhost:8081}

mdva:
  jwt:
    secret: ${JWT_SECRET:cambiame-dev-jwt-secret-de-al-menos-256-bits-para-hs256-signing}
    expiration-ms: 86400000  # 24 hours

logging:
  level:
    root: INFO
    ti.mdva: DEBUG
    org.jooq: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"