# =============================================================================
# MDVA — Docker Compose · Entorno de Development
# =============================================================================
# Levanta los 5 servicios: PostgreSQL + FastAPI ML + Routing Ambiental + Spring Boot Backend + React Frontend
#
# Uso:
#   docker compose -f docker-compose.dev.yml up --build
#   (requiere un .env en la raíz con GOOGLE_MAPS_API_KEY, POSTGRES_PASSWORD y JWT_SECRET; ver .env.example)
#   docker compose -f docker-compose.dev.yml down -v   ← borra también los volúmenes
#
# Puertos expuestos al host:
#   5436  → PostgreSQL (5432 interno, mapeado a 5436 en host para evitar conflicto con Postgres local)
#   8080  → Backend Spring Boot  (Swagger: http://localhost:8080/swagger-ui.html)
#   8081  → FastAPI ML           (Docs:    http://localhost:8081/docs)
#   8000  → Enrutamiento Ambiental (Docs: http://localhost:8000/docs)
#   8090  → Frontend React       (http://localhost:8090)
# =============================================================================

# Nombre fijo: los volúmenes (postgres_data, routing_graph_cache) no dependen del nombre de la carpeta
name: monitoreo-de-variables-ambientales

services:

  # ---------------------------------------------------------------------------
  # PostgreSQL 16
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: mdva-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       mdva
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5436:5432"
    volumes:
      # Script de inicialización: crea tablas + datos base al primer arranque
      - ./DB/init-docker.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      # Volumen persistente para no perder datos entre reinicios
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mdva"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # FastAPI — Microservicio ML (Predicción de lluvia)
  # ---------------------------------------------------------------------------
  ml-service:
    build:
      context: ./Data-science          # Ajustar si la carpeta tiene otro nombre
      dockerfile: Dockerfile
    container_name: mdva-ml
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      PORT: 8081
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ---------------------------------------------------------------------------
  # FastAPI — Enrutamiento Ambiental (OSMnx + NetworkX + MDVA ML)
  # ---------------------------------------------------------------------------
  routing-service:
    build:
      context: ./services/routing_api
      dockerfile: Dockerfile
    container_name: mdva-routing
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      MDVA_ML_URL:        http://ml-service:8081
      GRAPH_CACHE_FILE:   /app/cache/valle_aburra.graphml
      RAIN_MODEL_PATH:    /app/cache/rain_model.joblib
    volumes:
      # Persistir el grafo OSM descargado entre reinicios
      - routing_graph_cache:/app/cache
    depends_on:
      ml-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 120s

  # ---------------------------------------------------------------------------
  # Spring Boot Backend
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: mdva-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE:           dev
      SPRING_DATASOURCE_URL:            jdbc:postgresql://postgres:5432/mdva
      SPRING_DATASOURCE_USERNAME:       postgres
      SPRING_DATASOURCE_PASSWORD:       ${POSTGRES_PASSWORD}
      GOOGLE_MAPS_API_KEY:              ${GOOGLE_MAPS_API_KEY}
      JWT_SECRET:                       ${JWT_SECRET}
      ML_SERVICE_URL:                   http://ml-service:8081
      ROUTING_SERVICE_URL:              http://routing-service:8000
    depends_on:
      postgres:
        condition: service_healthy
      ml-service:
        condition: service_healthy
      routing-service:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # React Frontend (Vite build servido con nginx)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    container_name: mdva-frontend
    restart: unless-stopped
    ports:
      - "8090:80"
      - "8443:443"
    depends_on:
      - backend

volumes:
  postgres_data:
  routing_graph_cache:
