# =============================================================================
# MDVA — Docker Compose · Entorno de Producción
# =============================================================================
# Diferencias clave vs dev:
#   - postgres NO expone puerto al host (solo accesible dentro de la red)
#   - frontend NO expone puerto 8090 directamente (nginx en 80 + opcionalmente 443 vía reverse proxy externo)
#   - Todos los secrets vienen de .env (NUNCA hardcoded)
#   - restart: always en todos los servicios
#   - Logging acotado para no llenar disco del mini-server
#
# Uso:
#   cp .env.example .env  &&  vim .env       # completar valores reales
#   docker compose --env-file .env -f docker-compose.prod.yml up -d --build
#   docker compose --env-file .env -f docker-compose.prod.yml logs -f backend
# =============================================================================

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Nombre fijo: los volúmenes (postgres_data, routing_graph_cache) no dependen del nombre de la carpeta
name: monitoreo-de-variables-ambientales

services:

  postgres:
    image: postgres:16-alpine
    container_name: mdva-postgres
    restart: always
    environment:
      POSTGRES_DB:       ${POSTGRES_DB}
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./DB/init-docker.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *default-logging
    # Sin ports: solo accesible dentro de la red de docker

  ml-service:
    build:
      context: ./Data-science
      dockerfile: Dockerfile
    container_name: mdva-ml
    restart: always
    environment:
      PORT: 8081
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging: *default-logging

  routing-service:
    build:
      context: ./services/routing_api
      dockerfile: Dockerfile
    container_name: mdva-routing
    restart: always
    environment:
      MDVA_ML_URL:      http://ml-service:8081
      GRAPH_CACHE_FILE: /app/cache/valle_aburra.graphml
      RAIN_MODEL_PATH:  /app/cache/rain_model.joblib
    volumes:
      - routing_graph_cache:/app/cache
    depends_on:
      ml-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 8
      start_period: 120s
    logging: *default-logging

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: mdva-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE:     ${SPRING_PROFILES_ACTIVE:-prod}
      DATABASE_URL:               ${DATABASE_URL}
      DATABASE_USERNAME:          ${DATABASE_USERNAME}
      DATABASE_PASSWORD:          ${DATABASE_PASSWORD}
      JWT_SECRET:                 ${JWT_SECRET}
      GOOGLE_MAPS_API_KEY:        ${GOOGLE_MAPS_API_KEY}
      CORS_ALLOWED_ORIGINS:       ${CORS_ALLOWED_ORIGINS}
      ML_SERVICE_URL:             ${ML_SERVICE_URL:-http://ml-service:8081}
      ROUTING_SERVICE_URL:        ${ROUTING_SERVICE_URL:-http://routing-service:8000}
    depends_on:
      postgres:
        condition: service_healthy
      ml-service:
        condition: service_healthy
      routing-service:
        condition: service_healthy
    logging: *default-logging

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    container_name: mdva-frontend
    restart: always
    ports:
      - "8090:80"
    depends_on:
      - backend
    logging: *default-logging

volumes:
  postgres_data:
  routing_graph_cache:
