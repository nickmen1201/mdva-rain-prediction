[project]
name = "mdva-ml-api"
version = "1.0.0"
description = "Servicio FastAPI de predicción de lluvia (MDVA)"
requires-python = ">=3.11,<3.12"
# Versiones fijadas a las que corrían en el contenedor el 2026-10-28 (spec 002, R2)
dependencies = [
    "fastapi==0.115.6",
    "joblib==1.5.2",
    "numpy==2.4.6",
    "pydantic==2.10.3",
    "scikit-learn==1.8.0",
    "uvicorn[standard]==0.32.1",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==9.2.0",
]

[tool.uv]
package = false
